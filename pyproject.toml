[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-rag"
version = "1.0.0"
description = "Clinical decision support: Kafka→FHIR, IodineIQ Cognitive ML, GraphRAG summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "prometheus-client>=0.20.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "confluent-kafka>=2.5.0",
  "sqlalchemy>=2.0.32",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "neo4j>=5.20.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "tiktoken>=0.7.0",
  "rank-bm25>=0.2.2",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "httpx>=0.27.0",
]

[project.scripts]
clinical-rag = "clinical_rag.cli:main"
clinical-rag-worker = "clinical_rag.workers.kafka_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
